[project]
name = "arlogi"
version = "0.611.25"
description = "Robust, type-safe and highly configurable logging library for Python"
readme = "README.md"
authors = [
    { name = "Anton Razumov", email = "arazumov@checkpoint.com" }
]
requires-python = ">=3.13"
dependencies = [
    "rich>=14.2.0",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[dependency-groups]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
    "psutil>=7.2.1",
]
docs = [
    "mkdocs-material>=9.7.1",
    "mkdocstrings>=1.0.0",
    "mkdocstrings-python>=1.16.2",
    "pymdown-extensions>=10.19.1",
]
graph = [
    "graphifyy",
    "radon>=6.0.1",
]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "graph" },
    "commitizen>=4.0.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
version_files = ["pyproject.toml"]
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

[tool.uv.sources]
graphifyy = { git = "https://github.com/Graphify-Labs/graphify" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src/arlogi --cov-report=term-missing --cov-report=json"

[tool.coverage.run]
source = ["src/arlogi"]
branch = true
