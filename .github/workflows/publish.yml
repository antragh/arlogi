name: Publish Package & Create Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core Only (no-otel)
            sync-args: "--frozen --no-dev --group test"
            run-lint: "false"
          - name: Full Suite + Lint (otel)
            sync-args: "--frozen --no-dev --group test --extra otel"
            run-lint: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync ${{ matrix.sync-args }}

      - name: Run ruff check and format check
        if: matrix.run-lint == 'true'
        run: |
          uv run --no-sync ruff check src/ tests/
          uv run --no-sync ruff format --check src/ tests/

      - name: Run pytest
        run: uv run --no-sync pytest

  publish:
    name: Publish to PyPI & GitHub Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Verify tag matches pyproject.toml version
        run: |
          python -c "
          import os, tomllib
          with open('pyproject.toml', 'rb') as f:
              expected = f'v{tomllib.load(f)[\"project\"][\"version\"]}'
          actual = os.environ['GITHUB_REF_NAME']
          assert actual == expected, f'Tag {actual!r} != {expected!r}'
          "

      - name: Build package
        run: uv build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
